services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 10s
      retries: 10
      # start_period: 30s

  backend:
    build: ./back
    env_file: .env
    environment:
      DB_HOST: db        # nom du service
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"      # temporaire
    volumes:
      - static:/app/staticfiles
      - media:/app/mediafiles

volumes:
  pgdata:
  static:
  media:
