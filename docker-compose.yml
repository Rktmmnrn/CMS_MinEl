services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 10s
      timeout: 10s
      retries: 10
      # start_period: 30s

  backend:
    build: ./back        # Lit le Dockerfile dans le dossier back
    env_file: .env
    environment:
      DB_HOST: db        # nom du service
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"           # visible uniquement pour les autres services du réseau Docker
    volumes:
      - static:/app/staticfiles
      - media:/app/mediafiles

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/mediafiles:ro

volumes:
  pgdata:
  static:
  media:
